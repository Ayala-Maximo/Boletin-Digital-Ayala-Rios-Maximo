<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="caja-general">
  <header>
    <div class="logo">
      <img src="imagenes/guebarra.png" alt="Logo del colegio" class="png">
    </div>
    <div class="menu">
      <h2>Panel de Administración</h2>
    </div>
      <div class="usuario-menu">
        <img src="imagenes/hold.png" alt="Usuario" class="icono-usuario">
        <ul class="menu-desplegable">
          <li><strong id="usuario-nombre">Usuario</strong></li>
          <li><a href="/">Inicio</a></li>
          <li><a href="/dashboard">Calificaciones</a></li>
          <li><a href="/notas">Usuarios</a></li>
          <li><a href="#" id="logout-btn">Cerrar sesión</a></li>
        </ul>
      </div>
  </header>

  <main class="cuerpo">
    <section class="caja-notas">
      <div id="usuarios" class="seccion">
        <h3>Gestión de Usuarios</h3>
        <button onclick="abrirModal('usuarios')">+ Nuevo Usuario</button>
        <table class="tabla-notas" id="tablaUsuarios">
          <thead>
            <tr>
              <th>ID</th><th>Nombre</th><th>Apellido</th><th>Email</th><th>Rol</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title"></h3>
      <form id="modal-form"></form>
      <button onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 Dr. Ernesto Guevarra</p>
  </footer>
</div>

<script src="dashboard.js"></script>
<script src="index.js"></script>
</body>
</html>
