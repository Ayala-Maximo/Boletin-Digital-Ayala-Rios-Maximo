<!-- boletin.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Boletín - Colegio Dr. Ernesto Guevara</title>

    <link rel="stylesheet" href="css/boletin.css">
</head>
<body>
    <div class="caja-general">
        <header>
            <div class="logo" id="logo">
                <img src="/imagenes/guebarra.png" alt="Logo del colegio" class="png">
            </div>
            <div class="menu">
                <table>
                    <tr>
                        <th rowspan="2"><h3>Boletín Digital</h3></th>
                    </tr>
                </table>
            </div>
            <div class="usuario-menu">
                <img src="/imagenes/hold.png" alt="Usuario" class="icono-usuario">
                <ul class="menu-desplegable">
                    <li><strong id="usuario-nombre">Usuario</strong></li>
                    <li><a href="#" id="perfil-btn">Perfil</a></li>
                    <li><a href="/protec/alumnos/boletin.html" class="active">Boletín de Notas</a></li>
                    <li><a href="#" id="logout-btn">Cerrar sesión</a></li>
                </ul>
            </div>
        </header>
        
        <main class="cuerpo">
            <div class="boletin-container">
                <div class="boletin-header">
                    <h1>Boletín de Calificaciones</h1>
                    <p id="info-alumno">Alumno: Cargando...</p>
                    <p id="info-curso">Curso: Cargando...</p>
                </div>
                
                <div class="filtros">
                    <div class="filtro-item">
                        <label for="periodo-filter">Periodo:</label>
                        <select id="periodo-filter">
                            <option value="todos">Todos los periodos</option>
                        </select>
                    </div>
                    
                    <div class="filtro-item">
                        <label for="materia-filter">Materia:</label>
                        <select id="materia-filter">
                            <option value="todos">Todas las materias</option>
                        </select>
                    </div>
                    
                    <div class="filtro-item">
                        <button id="aplicar-filtros" class="imprimir-btn">Aplicar Filtros</button>
                    </div>
                </div>
                
                <div id="contenedor-boletin">
                    <p class="sin-notas">Cargando boletín...</p>
                </div>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button id="imprimir-boletin" class="imprimir-btn">Imprimir Boletín</button>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2024 Dr. Ernesto Guevara</p>
        </footer>

    </div>

    <script src="index.js"></script>
    <script src="boletin.js"></script>
</body>
</html>
